<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Argument Evaluation Viewer & Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for inner elements */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        
        #slider-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }

        .slide {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
        }

        .nav-button {
            position: fixed;
            bottom: 24px;
            z-index: 40;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }
        .nav-button:hover { background: #334155; transform: scale(1.05); }
        #prev-btn { right: 90px; }
        #next-btn { right: 24px; background: #2563eb; }
        #next-btn:hover { background: #1d4ed8; }
        
        .floating-stats-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 40;
        }
        
        .metric-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 4px;
            margin-bottom: 4px;
            background: #e2e8f0;
            color: #475569;
        }

        /* Modal Styles */
        #stats-modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(8px);
        }
        #stats-modal.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #stats-modal:not(.hidden) {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .stat-card {
            background: #f8fafc;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
        }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: #1e293b; line-height: 1.2; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 600; margin-bottom: 0.25rem;}
    </style>
</head>
<body>

    <div id="slider-container">
        <!-- Slides will be injected here by JS -->
    </div>

    <!-- Persistent Floating Stats Button -->
    <button onclick="openStatsModal()" class="floating-stats-btn bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-full font-bold flex items-center transition-all shadow-lg text-sm">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        View Aggregate Stats
    </button>

    <!-- Navigation Buttons -->
    <button id="prev-btn" class="nav-button" onclick="scrollSlider(-1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="next-btn" class="nav-button" onclick="scrollSlider(1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <!-- FULL SCREEN STATS MODAL -->
    <div id="stats-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/80 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-[90vw] max-w-6xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-3xl font-bold text-gray-800 flex items-center">
                    <svg class="w-8 h-8 mr-3 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Evaluation Statistics Dashboard
                </h2>
                <button onclick="closeStatsModal()" class="text-gray-400 hover:text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-full p-2 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-8 bg-white" id="stats-modal-content">
                <!-- Auto-calculated stats injected here -->
            </div>
        </div>
    </div>

<script>
// ============================================================================
// 0. GLOBAL CONFIGURATION FOR LOCAL FILE PATHS
// ============================================================================
const LOCAL_FILE_PATHS = [
    "../models/output_model/llava_outputs.json",
    "../models/output_model/minicpm-v_outputs.json",
    "../models/output_model/nemotron-3-nano-omni-30b-a3b-reasoning_outputs.json",
    "../evaluation/hallucination/llava_hallucination_deep.csv",
    "../evaluation/hallucination/minicpm-v_hallucination_deep.csv",
    "../evaluation/hallucination/nemotron-3-nano-omni-30b-a3b-reasoning-image-only_hallucination_deep.csv",
    "../evaluation/similarity/llava_similarity.csv",
    "../evaluation/similarity/minicpm-v_similarity.csv",
    "../evaluation/nli/llava_outputs_with_nli.csv",
    "../evaluation/nli/minicpm-v_outputs_with_nli.csv",
    "../evaluation/nli/nemotron-3-nano-omni-30b-a3b-reasoning-image-only_outputs_with_nli.csv"
];

// ============================================================================
// 1. DYNAMIC DATA LOADING
// ============================================================================
// Data will be loaded dynamically from files instead of being hardcoded

let optimalPrompt = "Loading prompt from file...";

async function loadPromptFromConfig() {
    try {
        const response = await fetch("../models/prompts.txt");
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const text = await response.text();
        
        // Extract user prompt from the new format
        if (text.includes("[USER]")) {
            optimalPrompt = text.split("[USER]")[1].trim();
        } else {
            optimalPrompt = text.trim();
        }
        
        console.log("Prompt loaded from prompts.txt");
    } catch (e) {
        console.error("Failed to load prompt:", e);
        optimalPrompt = "Failed to load prompt from file.";
    }
}

// ============================================================================
// 2. STATE & INITIALIZATION
// ============================================================================
let dataset = [];
const modelKeys = ['nemotron', 'minicpm', 'llava']; // Ordered for the dashboard
const modelNames = { human: 'Human Annotator', nemotron: 'Nemotron-3', minicpm: 'MiniCPM-V', llava: 'LLaVA' };
const modelColors = { 
    human: { bg: 'bg-green-50', header: 'bg-green-100', border: 'border-green-200', text: 'text-green-800' },
    nemotron: { bg: 'bg-blue-50', header: 'bg-blue-100', border: 'border-blue-200', text: 'text-blue-800' },
    minicpm: { bg: 'bg-purple-50', header: 'bg-purple-100', border: 'border-purple-200', text: 'text-purple-800' },
    llava: { bg: 'bg-orange-50', header: 'bg-orange-100', border: 'border-orange-200', text: 'text-orange-800' }
};

async function initData() {
    // Start with empty dataset - will be populated from files
    dataset = [];
    
    // Load prompt from config
    await loadPromptFromConfig();
    
    renderApp();
}

// ============================================================================
// 3. FILE PARSING LOGIC
// ============================================================================

function processFileContent(fileName, text) {
    const name = fileName.toLowerCase();
    console.log("Processing file:", fileName);
    
    try {
        if (name.endsWith('.json')) {
            let targetModel = '';
            if (name.includes('llava')) targetModel = 'llava';
            if (name.includes('minicpm')) targetModel = 'minicpm';
            if (name.includes('nemotron')) targetModel = 'nemotron';
            
            console.log("  → JSON file, matched model:", targetModel || "none");
            if (targetModel) {
                const json = JSON.parse(text);
                console.log("  → Loaded", json.length, "items for model:", targetModel);
                json.forEach(item => {
                    const dataRow = dataset.find(d => d.id === item.image_id);
                    if (dataRow && item.parsed_output) {
                        dataRow[targetModel].premises = item.parsed_output.premises || [];
                        dataRow[targetModel].conclusions = item.parsed_output.conclusions || [];
                    } else {
                        console.log("    No match for image_id:", item.image_id);
                    }
                });
            }
        }
        else if (name.includes('hallucination')) {
            let targetModel = '';
            if (name.includes('llava')) targetModel = 'llava';
            if (name.includes('minicpm')) targetModel = 'minicpm';
            if (name.includes('nemotron')) targetModel = 'nemotron';

            if (targetModel) {
                 parseCSV(text).forEach(row => {
                    if(row[0] && row[0] !== 'image_id') {
                        const dataRow = dataset.find(d => d.id === row[0]);
                        if (dataRow) {
                            dataRow[targetModel].metrics.hallucination_label = row[4];
                            dataRow[targetModel].metrics.hallucination_score = row[3];
                        }
                    }
                 });
            }
        }
        else if (name.includes('similarity')) {
            let targetModel = '';
            if (name.includes('llava')) targetModel = 'llava';
            if (name.includes('minicpm')) targetModel = 'minicpm';
            if (name.includes('nemotron')) targetModel = 'nemotron';

            if (targetModel) {
                 parseCSV(text).forEach(row => {
                    if(row[0] && row[0] !== 'image_id') {
                        const dataRow = dataset.find(d => d.id === row[0]);
                        if (dataRow) {
                            dataRow[targetModel].metrics.premise_sim = row[1];
                            dataRow[targetModel].metrics.conclusion_sim = row[5];
                        }
                    }
                 });
            }
        }
        else if (name.includes('nli')) {
            let targetModel = '';
            if (name.includes('llava')) targetModel = 'llava';
            if (name.includes('minicpm')) targetModel = 'minicpm';
            if (name.includes('nemotron')) targetModel = 'nemotron';

            if (targetModel) {
                 parseCSV(text).forEach(row => {
                    if(row[0] && row[0] !== 'image_id') {
                        const dataRow = dataset.find(d => d.id === row[0]);
                        if (dataRow) {
                            dataRow[targetModel].metrics.nli_label = row[10];
                            dataRow[targetModel].metrics.nli_conf = row[11];
                        }
                    }
                 });
            }
        }
    } catch (err) {
        console.error("Error parsing file content for", fileName, err);
    }
}

async function loadDataFromConfigPaths() {
    if (LOCAL_FILE_PATHS.length === 0) {
        alert("Please add your file paths to the LOCAL_FILE_PATHS array in the HTML code first.");
        return;
    }

    let loadedCount = 0;
    
    // First, load annotated.csv to create dataset entries
    const csvPath = "../dataset/annotated.csv";
    try {
        const response = await fetch(csvPath);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const text = await response.text();
        
        // Parse CSV and create dataset entries
        const rows = parseCSV(text);
        const header = rows[0];
        
        // Find column indices
        const idIdx = header.indexOf('id');
        const urlIdx = header.indexOf('url');
        const premisesIdx = header.indexOf('premises');
        const conclusionsIdx = header.indexOf('conclusions');
        
        // Create dataset entries from CSV
        dataset = [];
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const id = row[idIdx];
            const url = row[urlIdx];
            
            if (id) {
                // Use local image path instead of URL
                const localImagePath = `../dataset/images_for_annotation/${id}.jpg`;
                
                dataset.push({
                    id: id,
                    url: localImagePath,
                    note: "(Analysis notes will be loaded from file if available)",
                    human: { premises: ["(Data pending load)"], conclusions: ["(Data pending load)"], metrics: {} },
                    llava: { premises: ["(Data pending load)"], conclusions: ["(Data pending load)"], metrics: {} },
                    minicpm: { premises: ["(Data pending load)"], conclusions: ["(Data pending load)"], metrics: {} },
                    nemotron: { premises: ["(Data pending load)"], conclusions: ["(Data pending load)"], metrics: {} }
                });
                
                // Parse human premises and conclusions if available
                if (premisesIdx !== -1 && row[premisesIdx]) {
                    try {
                        dataset[dataset.length - 1].human.premises = JSON.parse(row[premisesIdx].replace(/""/g, '"'));
                    } catch(e) { /* Keep default */ }
                }
                if (conclusionsIdx !== -1 && row[conclusionsIdx]) {
                    try {
                        dataset[dataset.length - 1].human.conclusions = JSON.parse(row[conclusionsIdx].replace(/""/g, '"'));
                    } catch(e) { /* Keep default */ }
                }
            }
        }
        
        console.log(`Created ${dataset.length} dataset entries from annotated.csv`);
        loadedCount++;
    } catch (e) {
        console.error("Failed to load annotated.csv:", e);
        alert(`Failed to load ${csvPath}. Ensure you are running a local web server.`);
        return;
    }
    
    // Then load other files
    for (const path of LOCAL_FILE_PATHS) {
        try {
            const response = await fetch(path);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const text = await response.text();
            processFileContent(path, text);
            loadedCount++;
        } catch (e) {
            console.error("Failed to load path:", path, e);
            // Continue with other files
        }
    }
    
    if (loadedCount > 0) {
        renderApp();
        if(!document.getElementById('stats-modal').classList.contains('hidden')) generateStatsDashboard();
        alert(`Successfully loaded data for ${dataset.length} images!`);
    }
}

function parseCSV(str) {
    const arr = [];
    let quote = false;
    for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
    }
    return arr;
}

// ============================================================================
// 4. ANALYTICS DASHBOARD (AUTO-CALCULATED)
// ============================================================================

function openStatsModal() {
    generateStatsDashboard();
    document.getElementById('stats-modal').classList.remove('hidden');
}

function closeStatsModal() {
    document.getElementById('stats-modal').classList.add('hidden');
}

function calculateStatsData() {
    const statsData = {};
    modelKeys.forEach(model => {
        let hallCount = 0, hallTotal = 0;
        let entCount = 0, contCount = 0, nliTotal = 0;
        let pSimSum = 0, pSimCount = 0;
        let cSimSum = 0, cSimCount = 0;

        dataset.forEach(d => {
            const m = d[model].metrics;
            if (m) {
                if (m.hallucination_label) {
                    hallTotal++;
                    if (m.hallucination_label.toLowerCase() === 'hallucinated') hallCount++;
                }
                if (m.nli_label) {
                    nliTotal++;
                    if (m.nli_label.toLowerCase() === 'entailment') entCount++;
                    if (m.nli_label.toLowerCase() === 'contradiction') contCount++;
                }
                if (m.premise_sim !== undefined) {
                    pSimSum += parseFloat(m.premise_sim);
                    pSimCount++;
                }
                if (m.conclusion_sim !== undefined) {
                    cSimSum += parseFloat(m.conclusion_sim);
                    cSimCount++;
                }
            }
        });

        statsData[model] = {
            loaded: hallTotal > 0 || nliTotal > 0 || pSimCount > 0,
            hallucinationRate: hallTotal > 0 ? ((hallCount / hallTotal) * 100).toFixed(1) + '%' : 'N/A',
            entailmentRate: nliTotal > 0 ? ((entCount / nliTotal) * 100).toFixed(1) + '%' : 'N/A',
            contradictionRate: nliTotal > 0 ? ((contCount / nliTotal) * 100).toFixed(1) + '%' : 'N/A',
            pSimAvg: pSimCount > 0 ? (pSimSum / pSimCount).toFixed(3) : 'N/A',
            cSimAvg: cSimCount > 0 ? (cSimSum / cSimCount).toFixed(3) : 'N/A',
            count: Math.max(hallTotal, nliTotal, pSimCount)
        };
    });
    return statsData;
}


function generateStatsDashboard() {
    const container = document.getElementById('stats-modal-content');
    const statsData = calculateStatsData();
    let html = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-full">`;
    
    modelKeys.forEach(model => {
        const stats = statsData[model];
        const color = modelColors[model];
        const title = modelNames[model];
        html += generateStatsCardHTML(title, stats, color);
    });
    
    html += `</div>`;
    container.innerHTML = html;
}

function generateStatsCardHTML(title, stats, color) {
    return `
        <div class="rounded-2xl border ${color.border} flex flex-col overflow-hidden shadow-sm h-full min-h-[350px]">
            <div class="px-6 py-4 font-bold text-lg flex items-center justify-between ${color.header} ${color.text} border-b ${color.border}">
                ${title}
                <span class="text-xs font-normal opacity-70 bg-white/50 px-2 py-1 rounded-full border border-white/50">
                    N = ${stats.count}
                </span>
            </div>
            
            <div class="p-6 space-y-6 flex-1 bg-white">
                ${!stats.loaded ? `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60">
                        <svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <p>No evaluation data loaded</p>
                    </div>
                ` : `
                    <!-- Hallucination Block -->
                    <div class="stat-card">
                        <div class="stat-label">Hallucination Rate (Deep Eval)</div>
                        <div class="flex items-end justify-between">
                            <div class="stat-val ${parseFloat(stats.hallucinationRate) > 15 ? 'text-red-500' : 'text-green-600'}">
                                ${stats.hallucinationRate}
                            </div>
                            <div class="text-xs text-gray-400 mb-1">Lower is better</div>
                        </div>
                    </div>

                    <!-- NLI Block -->
                    <div class="stat-card">
                        <div class="stat-label flex justify-between">
                            <span>NLI Entailment</span>
                            <span>Contradiction</span>
                        </div>
                        <div class="flex items-center justify-between mt-1">
                            <div class="stat-val text-blue-600">${stats.entailmentRate}</div>
                            <div class="h-6 w-px bg-gray-300"></div>
                            <div class="stat-val text-orange-500">${stats.contradictionRate}</div>
                        </div>
                    </div>

                    <!-- Similarity Block -->
                    <div class="stat-card">
                        <div class="stat-label mb-3">BERT Similarity (Vs. Human)</div>
                        
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm text-gray-600">Premises:</span>
                            <span class="font-bold text-gray-800">${stats.pSimAvg}</span>
                        </div>
                        
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mb-4">
                            <div class="bg-indigo-500 h-1.5 rounded-full" style="width: ${stats.pSimAvg !== 'N/A' ? (parseFloat(stats.pSimAvg) * 100) : 0}%"></div>
                        </div>

                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm text-gray-600">Conclusions:</span>
                            <span class="font-bold text-gray-800">${stats.cSimAvg}</span>
                        </div>
                        
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div class="bg-indigo-500 h-1.5 rounded-full" style="width: ${stats.cSimAvg !== 'N/A' ? (parseFloat(stats.cSimAvg) * 100) : 0}%"></div>
                        </div>
                    </div>
                `}
            </div>
        </div>`;
}

// ============================================================================
// 5. RENDERING LOGIC (SLIDES)
// ============================================================================
function renderApp() {
    const container = document.getElementById('slider-container');
    let html = '';
    const statsData = calculateStatsData();

    // --------------------------------------------------
    // Slide 0: Intro Slide
    // --------------------------------------------------
    html += `
    <div class="slide bg-gray-50 flex-col items-center p-8" style="overflow-y: auto; justify-content: flex-start; padding-top: 40px;">
        <div class="max-w-4xl w-full text-center">
            <h1 class="text-5xl font-bold text-gray-800 mb-6">Visual Argument Evaluation Viewer</h1>
            <p class="text-xl text-gray-600 mb-10">A deep analysis of LLaVA, MiniCPM-V, and Nemotron on stance-aware visual reasoning across climate images.</p>
            
            <div class="bg-white p-8 rounded-2xl shadow-xl text-left border border-gray-200 mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <svg class="w-6 h-6 text-green-500 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    The Optimized Prompt Strategy
                </h2>
                <p class="text-gray-600 mb-4">To solve the gap between literal visual grounding and human abductive reasoning, the prompt must explicitly divide the task: strict visuals for premises, and permitted world-knowledge for conclusions.</p>
                <pre class="bg-gray-900 text-gray-100 p-6 rounded-xl overflow-x-auto text-sm shadow-inner whitespace-pre-wrap">${optimalPrompt}</pre>
            </div>

            <div class="flex flex-col items-center">
                
                <div class="flex flex-row justify-center gap-4 mb-3">
                    <button onclick="loadDataFromConfigPaths()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-full flex items-center transition-all shadow-lg text-lg font-bold">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        Load All Data
                    </button>
                </div>
                
                <div class="flex gap-4 mt-8">
                    <button onclick="scrollSlider(1)" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-full font-bold text-lg flex items-center transition-all shadow-xl">
                        View Overall Results
                        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    `;

    // --------------------------------------------------
    // Slide 1: Overall Results Dashboard (New Academic Summary Slide)
    // --------------------------------------------------
    html += `
    <div class="slide bg-white flex-col items-center justify-center p-8 overflow-y-auto">
        <div class="max-w-7xl w-full text-center mb-10 mt-10">
            <h2 class="text-4xl font-bold text-gray-800 flex justify-center items-center">
                <svg class="w-10 h-10 mr-3 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Overall Academic Performance
            </h2>
            <p class="text-xl text-gray-500 mt-2">Aggregated evaluation across Hallucination (Deep Eval), Natural Language Inference (NLI), and BERT Similarity vs. Human Baseline</p>
        </div>
        <div class="max-w-7xl w-full grid grid-cols-1 md:grid-cols-3 gap-8">
    `;
    
    // Inject the exact same card style logic for the slides using our stats helper
    modelKeys.forEach(model => {
        const stats = statsData[model];
        const color = modelColors[model];
        const title = modelNames[model];
        html += generateStatsCardHTML(title, stats, color);
    });

    html += `
        </div>
        <div class="max-w-7xl w-full text-center mt-10 mb-10">
            <button onclick="scrollSlider(1)" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-full font-bold text-lg flex items-center justify-center mx-auto transition-all shadow-xl">
                Start Image Analysis
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>
    `;


    // --------------------------------------------------
    // Slide 2 to N: Data Slides
    // --------------------------------------------------
    dataset.forEach((data, index) => {
        html += `
        <div class="slide bg-gray-100 overflow-hidden">
            <!-- LEFT PANEL -->
            <div class="w-1/3 bg-gray-900 text-white flex flex-col h-full shadow-2xl z-10 border-r border-gray-800">
                <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-900">
                    <span class="font-bold text-xl text-blue-400">Image ID: ${data.id}</span>
                    <span class="text-sm bg-gray-800 px-3 py-1 rounded-full text-gray-400">Image ${index + 1} of ${dataset.length}</span>
                </div>
                <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
                    <div class="w-full rounded-xl overflow-hidden shadow-2xl mb-8 bg-black flex items-center justify-center min-h-[300px]">
                        ${data.url ? `<img src="${data.url}" class="object-contain max-h-[50vh] w-full" alt="Image ${data.id}" onerror="this.parentElement.innerHTML='<p class=\\'text-gray-500\\'>Image not found: ${data.id}.jpg</p>'" />` : '<p class="text-gray-500">No Image URL</p>'}
                    </div>
                    <div class="w-full bg-blue-900/30 border border-blue-800/50 rounded-xl p-6 shadow-inner">
                        <h3 class="text-blue-300 font-bold mb-3 flex items-center text-lg">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            AI Deep Analysis
                        </h3>
                        <p class="text-gray-300 text-sm leading-relaxed whitespace-pre-wrap">${data.note}</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="w-2/3 h-full overflow-y-auto p-8 bg-gray-50">
                <div class="grid grid-cols-2 gap-6 pb-24">
                    ${['human', ...modelKeys].map(key => renderModelCard(key, data[key])).join('')}
                </div>
            </div>
        </div>
        `;
    });

    container.innerHTML = html;
}

function renderModelCard(modelKey, modelData) {
    const title = modelNames[modelKey];
    const colors = modelColors[modelKey];
    
    const premises = Array.isArray(modelData.premises) ? modelData.premises : [];
    const conclusions = Array.isArray(modelData.conclusions) ? modelData.conclusions : [];
    
    let premiseHtml = premises.length > 0 
        ? `<ul class="space-y-2">` + premises.map(p => {
            const text = typeof p === 'string' ? p : p.text || p.observation || p.description || JSON.stringify(p);
            return `<li class="text-sm bg-white/70 p-3 rounded-lg border border-white shadow-sm text-gray-800">${text}</li>`;
          }).join('') + `</ul>`
        : `<p class="text-sm italic opacity-60 text-gray-500">No premises extracted / Data pending load.</p>`;
        
    let conclusionHtml = conclusions.length > 0 
        ? `<ul class="space-y-2">` + conclusions.map(c => {
            const text = typeof c === 'string' ? c : c.text || c.inference || c.description || JSON.stringify(c);
            return `<li class="text-sm bg-white/70 p-3 rounded-lg border border-white shadow-sm font-medium text-gray-900">${text}</li>`;
          }).join('') + `</ul>`
        : `<p class="text-sm italic opacity-60 text-gray-500">No conclusions extracted / Data pending load.</p>`;

    let metricsHtml = '';
    if (modelData.metrics && Object.keys(modelData.metrics).length > 0) {
        const m = modelData.metrics;
        if(m.hallucination_label) metricsHtml += `<span class="metric-badge">Hallucination: ${m.hallucination_label} (${parseFloat(m.hallucination_score).toFixed(2)})</span>`;
        if(m.nli_label) metricsHtml += `<span class="metric-badge">NLI: ${m.nli_label}</span>`;
        if(m.premise_sim) metricsHtml += `<span class="metric-badge">P-Sim: ${parseFloat(m.premise_sim).toFixed(2)}</span>`;
        if(m.conclusion_sim) metricsHtml += `<span class="metric-badge">C-Sim: ${parseFloat(m.conclusion_sim).toFixed(2)}</span>`;
    }

    return `
    <div class="rounded-2xl border shadow-sm flex flex-col h-[420px] ${colors.bg} ${colors.border}">
        <div class="px-5 py-4 border-b rounded-t-2xl font-bold flex items-center justify-between ${colors.header} ${colors.text} border-opacity-50">
            <span>${title}</span>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-5">
            <div>
                <h4 class="text-xs uppercase font-bold tracking-wider opacity-60 mb-3 text-gray-700">Premises (Visual Grounding)</h4>
                ${premiseHtml}
            </div>
            <div>
                <h4 class="text-xs uppercase font-bold tracking-wider opacity-60 mb-3 text-gray-700">Conclusions (Inference)</h4>
                ${conclusionHtml}
            </div>
        </div>
        ${metricsHtml ? `<div class="p-3 border-t bg-white/40 border-opacity-20 rounded-b-2xl">${metricsHtml}</div>` : ''}
    </div>
    `;
}

// ============================================================================
// 6. SLIDER LOGIC
// ============================================================================
function scrollSlider(direction) {
    const container = document.getElementById('slider-container');
    const slideWidth = window.innerWidth;
    container.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
}

// Initialize on load
initData();

</script>
