<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Argument Evaluation Viewer & Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for inner elements */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        
        #slider-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }

        .slide {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
        }

        .nav-button {
            position: fixed;
            bottom: 24px;
            z-index: 40;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }
        .nav-button:hover { background: #334155; transform: scale(1.05); }
        #prev-btn { right: 90px; }
        #next-btn { right: 24px; background: #2563eb; }
        #next-btn:hover { background: #1d4ed8; }
        
        .floating-stats-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 40;
        }
        
        .metric-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 4px;
            margin-bottom: 4px;
            background: #e2e8f0;
            color: #475569;
        }

        .stat-card {
            background: #f8fafc;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
        }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: #1e293b; line-height: 1.2; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 600; margin-bottom: 0.25rem;}
        
        /* Search Bar */
        .search-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-input {
            width: 150px;
            padding: 12px 16px;
            border-radius: 9999px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .search-btn {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }
        .search-btn:hover { background: #334155; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="slider-container">
        <!-- Slides will be injected here by JS -->
    </div>

    <!-- Navigation Buttons -->
    <button id="prev-btn" class="nav-button" onclick="scrollSlider(-1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="next-btn" class="nav-button" onclick="scrollSlider(1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Search ID..." onkeypress="if(event.key==='Enter') searchAndGoToSlide()">
        <button onclick="searchAndGoToSlide()" class="search-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
    </div>

<script>
// ============================================================================
// 0. GLOBAL CONFIGURATION
// ============================================================================
const API_BASE = '';

// ============================================================================
// 1. DYNAMIC DATA LOADING FROM SERVER
// ============================================================================
// Data will be loaded dynamically from server

let optimalPrompt = "Loading prompt from file...";
let systemPrompt = "";
let userPrompt = "";

async function loadPromptFromConfig() {
    try {
        const response = await fetch(`${API_BASE}/api/prompts`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        const text = data.content;
        
        if (text.includes("[SYSTEM]") && text.includes("[USER]")) {
            systemPrompt = text.split("[SYSTEM]")[1].split("[USER]")[0].trim();
            userPrompt = text.split("[USER]")[1].trim();
            optimalPrompt = userPrompt;
        } else {
            userPrompt = text.trim();
            optimalPrompt = userPrompt;
            systemPrompt = "No system prompt defined.";
        }
        
        console.log("Prompts loaded from server");
    } catch (e) {
        console.error("Failed to load prompts:", e);
        optimalPrompt = "Failed to load prompt from file.";
        systemPrompt = "Failed to load.";
        userPrompt = "Failed to load.";
    }
}

// ============================================================================
// 2. STATE & INITIALIZATION
// ============================================================================
let dataset = [];
const modelKeys = ['nemotron', 'minicpm', 'llava'];
const modelNames = { human: 'Human Annotator', nemotron: 'Nemotron-3', minicpm: 'MiniCPM-V', llava: 'LLaVA' };
const modelColors = { 
    human: { bg: 'bg-green-50', header: 'bg-green-100', border: 'border-green-200', text: 'text-green-800' },
    nemotron: { bg: 'bg-blue-50', header: 'bg-blue-100', border: 'border-blue-200', text: 'text-blue-800' },
    minicpm: { bg: 'bg-purple-50', header: 'bg-purple-100', border: 'border-purple-200', text: 'text-purple-800' },
    llava: { bg: 'bg-orange-50', header: 'bg-orange-100', border: 'border-orange-200', text: 'text-orange-800' }
};

async function loadAllDataFromServer() {
    // Load prompts
    await loadPromptFromConfig();
    
    // Load reviewer data
    await loadReviewerData();
    
    // Load dataset from CSV via server
    try {
        const resp = await fetch(`${API_BASE}/api/dataset`);
        if (!resp.ok) throw new Error('Failed to load dataset');
        const csvData = await resp.json();
        
        dataset = csvData.map(item => ({
            id: item.id,
            url: `${API_BASE}/api/images/${item.id}.jpg`,
            note: "",
            human: { premises: item.premises || [], conclusions: item.conclusions || [], metrics: {} },
            llava: { premises: [], conclusions: [], metrics: {} },
            minicpm: { premises: [], conclusions: [], metrics: {} },
            nemotron: { premises: [], conclusions: [], metrics: {} }
        }));
        
        console.log(`Loaded ${dataset.length} images from server`);
    } catch (e) {
        console.error("Failed to load dataset:", e);
        return;
    }
    
    // Load model outputs
    try {
        const resp = await fetch(`${API_BASE}/api/outputs`);
        if (!resp.ok) throw new Error('Failed to list outputs');
        const outputFiles = await resp.json();
        
        for (const file of outputFiles) {
            try {
                const resp = await fetch(`${API_BASE}/api/outputs/${file}`);
                if (!resp.ok) continue;
                const data = await resp.json();
                
                let targetModel = '';
                if (file.includes('llava')) targetModel = 'llava';
                if (file.includes('minicpm')) targetModel = 'minicpm';
                if (file.includes('nemotron')) targetModel = 'nemotron';
                
                if (targetModel && Array.isArray(data)) {
                    data.forEach(item => {
                        const dataRow = dataset.find(d => d.id === item.image_id);
                        if (dataRow && item.parsed_output) {
                            dataRow[targetModel].premises = item.parsed_output.premises || [];
                            dataRow[targetModel].conclusions = item.parsed_output.conclusions || [];
                        }
                    });
                    console.log(`Loaded ${data.length} items from ${file}`);
                }
            } catch (e) {
                console.error(`Failed to load output file ${file}:`, e);
            }
        }
    } catch (e) {
        console.error("Failed to load outputs:", e);
    }
    
    // Load evaluation metrics (CSV files)
    await loadMetricsFromServer();
    
    // Render and populate UI
    renderApp();
    setTimeout(() => loadReviewerDataToUI(), 100);
}

async function loadMetricsFromServer() {
    const metricsFiles = [
        { pattern: 'hallucination', key: 'hallucination', fields: ['hallucination_label', 'hallucination_score'] },
        { pattern: 'similarity', key: 'similarity', fields: ['premise_sim', 'conclusion_sim'] },
        { pattern: 'nli', key: 'nli', fields: ['nli_label', 'nli_conf'] }
    ];
    
    const modelPatterns = ['llava', 'minicpm', 'nemotron'];
    
    // Try to load metrics - these might be in OUTPUT_DIR or DATASET_DIR
    for (const model of modelPatterns) {
        for (const metric of metricsFiles) {
            const filename = `${model}_${metric.pattern}.csv`;
            try {
                // Try loading from output dir first, then dataset dir
                let resp = await fetch(`${API_BASE}/api/outputs/${filename}`);
                if (!resp.ok) {
                    // Could also try dataset dir if needed
                    continue;
                }
                const text = await resp.text();
                const rows = parseCSV(text);
                const header = rows[0];
                
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row[0] && row[0] !== 'image_id') {
                        const dataRow = dataset.find(d => d.id === row[0]);
                        if (dataRow) {
                            if (metric.key === 'hallucination') {
                                dataRow[model].metrics.hallucination_label = row[4];
                                dataRow[model].metrics.hallucination_score = row[3];
                            } else if (metric.key === 'similarity') {
                                dataRow[model].metrics.premise_sim = row[1];
                                dataRow[model].metrics.conclusion_sim = row[5];
                            } else if (metric.key === 'nli') {
                                dataRow[model].metrics.nli_label = row[10];
                                dataRow[model].metrics.nli_conf = row[11];
                            }
                        }
                    }
                }
                console.log(`Loaded ${metric.key} metrics for ${model}`);
            } catch (e) {
                // Skip missing metric files
            }
        }
    }
}

async function initData() {
    dataset = [];
    await loadAllDataFromServer();
}

function parseCSV(str) {
    const arr = [];
    let quote = false;
    for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
    }
    return arr;
}

function switchModelTab(imageId, modelKey) {
    document.querySelectorAll('.model-tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll(`[id^="tab-"][id$="-${imageId}"]`).forEach(btn => {
        btn.className = 'tab-btn flex-1 px-4 py-3 text-sm font-bold text-center transition-all border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100';
    });
    const content = document.getElementById(`tabcontent-${modelKey}-${imageId}`);
    if (content) content.classList.remove('hidden');
    const tab = document.getElementById(`tab-${modelKey}-${imageId}`);
    if (tab) {
        const colorMap = {
            human: 'border-green-500 text-green-700 bg-green-50',
            llava: 'border-orange-500 text-orange-700 bg-orange-50',
            minicpm: 'border-purple-500 text-purple-700 bg-purple-50',
            nemotron: 'border-blue-500 text-blue-700 bg-blue-50'
        };
        tab.className = `tab-btn flex-1 px-4 py-3 text-sm font-bold text-center transition-all border-b-2 ${colorMap[modelKey] || 'border-gray-500 text-gray-700 bg-gray-50'}`;
    }
}

// ============================================================================
// 5. RENDERING LOGIC (SLIDES)
// ============================================================================
// 5. RENDERING LOGIC (SLIDES)
// ============================================================================

    <div class="slide bg-gray-50 flex-col items-center p-8" style="overflow-y: auto; justify-content: flex-start; padding-top: 40px;">

            <h1 class="text-5xl font-bold text-gray-800 mb-6">Visual Argument Evaluation Viewer</h1>

            <div class="bg-white p-8 rounded-2xl shadow-xl text-left border border-gray-200 mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <svg class="w-6 h-6 text-green-500 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    Prompt Configuration
                </h2>
                <p class="text-gray-600 mb-6">The prompt strategy uses a two-part structure with separate system and user prompts to guide the AI models in climate-related visual reasoning.</p>
                
                <!-- System Prompt Section -->
                <div class="mb-6">
                    <h3 class="text-lg font-bold text-blue-700 mb-3 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>

                <div class="mb-6">

                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        User Prompt
                    </h3>
                    <div class="bg-green-50 border border-green-200 rounded-xl p-4">

                    </div>
                </div>
                
                <!-- Model Usage Summary -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                    <h3 class="text-lg font-bold text-gray-700 mb-3">Model Prompt Usage</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                        <div class="bg-white p-3 rounded-lg border border-gray-200">
                            <p class="font-bold text-orange-600">LLaVA</p>
                            <p class="text-gray-600">System: Custom system prompt</p>
                            <p class="text-gray-600">User: Full task prompt</p>
                        </div>
                        <div class="bg-white p-3 rounded-lg border border-gray-200">
                            <p class="font-bold text-purple-600">MiniCPM-V</p>
                            <p class="text-gray-600">System: Custom system prompt</p>
                            <p class="text-gray-600">User: Full task prompt</p>
                        </div>

                            <p class="font-bold text-blue-600">Nemotron-3</p>
                            <p class="text-gray-600">System: Custom system prompt</p>
                            <p class="text-gray-600">User: Full task prompt</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-center">
                
                <div class="flex gap-4 mt-8">
                    <button onclick="scrollSlider(1)" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-full font-bold text-lg flex items-center transition-all shadow-xl">
                        Start Review
                        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

        </div>
    </div>
    `;


    // --------------------------------------------------
    // Slide 1 to N: Data Slides
    // --------------------------------------------------
    dataset.forEach((data, index) => {
        html += `
        <div class="slide bg-gray-100 overflow-hidden flex">

}

function renderModelCardContent(modelKey, modelData, imageId) {
    const title = modelNames[modelKey];
    
    const premises = Array.isArray(modelData.premises) ? modelData.premises : [];
    const conclusions = Array.isArray(modelData.conclusions) ? modelData.conclusions : [];
    
    let premiseHtml = premises.length > 0 
        ? `<ul class="space-y-2">` + premises.map((p, i) => {
            const text = typeof p === 'string' ? p : p.text || p.observation || p.description || JSON.stringify(p);
            return `<li class="text-sm bg-white p-3 rounded-lg border border-gray-200 shadow-sm text-gray-800"><span class="font-bold text-gray-500 mr-2">${i+1}.</span>${text}</li>`;
          }).join('') + `</ul>`
        : `<p class="text-sm italic opacity-60 text-gray-500">No premises extracted / Data pending load.</p>`;
        
    let conclusionHtml = conclusions.length > 0 
        ? `<ul class="space-y-2">` + conclusions.map((c, i) => {

    ` : '';

    let metricsHtml = '';
    if (modelData.metrics && Object.keys(modelData.metrics).length > 0) {
        const m = modelData.metrics;
        if(m.hallucination_label) metricsHtml += `<span class="metric-badge">Hallucination: ${m.hallucination_label} (${parseFloat(m.hallucination_score).toFixed(2)})</span>`;
        if(m.nli_label) metricsHtml += `<span class="metric-badge">NLI: ${m.nli_label}</span>`;
        if(m.premise_sim) metricsHtml += `<span class="metric-badge">P-Sim: ${parseFloat(m.premise_sim).toFixed(2)}</span>`;
        if(m.conclusion_sim) metricsHtml += `<span class="metric-badge">C-Sim: ${parseFloat(m.conclusion_sim).toFixed(2)}</span>`;
    }

    return `
    <div class="space-y-5">
        <div>
            <h4 class="text-xs uppercase font-bold tracking-wider opacity-60 mb-3 text-gray-700">Premises (Visual Grounding)</h4>

        </div>
        <div>
            <h4 class="text-xs uppercase font-bold tracking-wider opacity-60 mb-3 text-gray-700">Conclusions (Inference)</h4>
            ${conclusionHtml}

        ${evaluationHtml}
        ${metricsHtml ? `<div class="flex flex-wrap gap-2">${metricsHtml}</div>` : ''}

}

// ============================================================================
// 6. REVIEWER COMMENTS & EVALUATION FUNCTIONS
// ============================================================================

// Store for all reviews
let reviewerData = {};
const API_URL = '/api/reviewer';

async function saveToServer() {
    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reviewerData)
        });
    } catch (e) {
        console.warn('Server save failed, using localStorage fallback');
        localStorage.setItem('reviewerData', JSON.stringify(reviewerData));
    }
}

function saveComment(imageId) {
    const textarea = document.getElementById(`comment-${imageId}`);
    if (!textarea) return;
    
    if (!reviewerData[imageId]) {
        reviewerData[imageId] = { comment: '', evaluations: {} };
    }
    reviewerData[imageId].comment = textarea.value;
    
    saveToServer();
    console.log(`Comment saved for image ${imageId}`);
}

function saveEvaluation(imageId, modelKey) {
    if (!reviewerData[imageId]) {
        reviewerData[imageId] = { comment: '', evaluations: {} };
    }
    
    if (!reviewerData[imageId].evaluations[modelKey]) {
        reviewerData[imageId].evaluations[modelKey] = {};
    }
    
    // Get all evaluation values from radio buttons by name
    const metrics = ['format', 'visual', 'premise', 'conclusion', 'inference', 'alignment'];
    const keys = ['format_adherence', 'visual_only_rule', 'premise_accuracy', 'conclusion_logic', 'inference_depth', 'human_alignment'];
    
    metrics.forEach((metric, i) => {
        const selected = document.querySelector(`input[name="${metric}-${modelKey}-${imageId}"]:checked`);
        reviewerData[imageId].evaluations[modelKey][keys[i]] = selected ? selected.value : '';
    });
    
    saveToServer();
    console.log(`Evaluation saved for image ${imageId}, model ${modelKey}`);
}

async function loadReviewerData() {
    try {
        const resp = await fetch(API_URL);
        if (resp.ok) {
            reviewerData = await resp.json();
            console.log('Loaded reviewer data from server');
            return;
        }
    } catch (e) {
        console.warn('Server load failed, trying localStorage');
    }
    const saved = localStorage.getItem('reviewerData');
    if (saved) {
        reviewerData = JSON.parse(saved);
        console.log('Loaded reviewer data from localStorage');
    }
}

function loadReviewerDataToUI() {
    // Load comments
    dataset.forEach(data => {
        const textarea = document.getElementById(`comment-${data.id}`);
        if (textarea && reviewerData[data.id]) {
            textarea.value = reviewerData[data.id].comment || '';
        }
        
        // Load evaluations for each model
        modelKeys.forEach(modelKey => {
            if (reviewerData[data.id] && reviewerData[data.id].evaluations[modelKey]) {
                const evalData = reviewerData[data.id].evaluations[modelKey];
                
                const metrics = ['format', 'visual', 'premise', 'conclusion', 'inference', 'alignment'];
                const keys = ['format_adherence', 'visual_only_rule', 'premise_accuracy', 'conclusion_logic', 'inference_depth', 'human_alignment'];
                
                metrics.forEach((metric, i) => {
                    const value = evalData[keys[i]];
                    if (value) {
                        const radio = document.querySelector(`input[name="${metric}-${modelKey}-${data.id}"][value="${value}"]`);
                        if (radio) radio.checked = true;
                    }
                });
            }
        });
    });
}

// ============================================================================
// 7. SLIDER LOGIC
// ============================================================================
function scrollSlider(direction) {
    const container = document.getElementById('slider-container');
    const slideWidth = window.innerWidth;
    container.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
}

function searchAndGoToSlide() {
    const searchInput = document.getElementById('search-input');
    const searchId = searchInput.value.trim();
    
    if (!searchId) {
        alert('Please enter an image ID');
        return;
    }
    
    if (dataset.length === 0) {
        alert('No data loaded. Please wait for data to load automatically.');
        return;
    }
    
    // Find the index of the image with the given ID
    const index = dataset.findIndex(d => d.id === searchId);
    
    if (index === -1) {
        alert(`Image with ID "${searchId}" not found in dataset`);
        return;
    }
    
    // Navigate to the slide (index + 1 because slide 0 is intro)
    const container = document.getElementById('slider-container');
    const slideWidth = window.innerWidth;
    const targetScroll = (index + 1) * slideWidth;
    
    container.scrollTo({ left: targetScroll, behavior: 'smooth' });
    
    // Clear search input
    searchInput.value = '';
}

// Initialize on load
initData();
