                        <p class="text-gray-700 text-sm">MiniCPM-V and Nemotron-3 have stronger connections between premises and conclusions. LLaVA often has weak or disconnected conclusions.</p>
                    </div>
                    <div class="observation">
                        <p class="text-green-800 font-bold mb-1">Inference Depth</p>
                        <p class="text-gray-700 text-sm">MiniCPM-V and Nemotron-3 provide more specific insights. LLaVA tends to give generic slogans or purely descriptive answers.</p>
                    </div>
                    <div class="observation">
                        <p class="text-green-800 font-bold mb-1">Human Alignment</p>
                        <p class="text-gray-700 text-sm">MiniCPM-V matches human answers best. LLaVA is often unrelated or too verbose.</p>
                    </div>
                    <div class="observation">
                        <p class="text-green-800 font-bold mb-1">AI vs Human</p>
                        <p class="text-gray-700 text-sm">In some cases, models saw details that humans missed (e.g., Nemotron saw birds, boat models, firefighters). This shows potential for AI-assisted analysis.</p>
                    </div>
                </div>
            </div>

            <!-- SLIDE 5: Detailed Comments (Last Slide) -->
            <div class="slide bg-slate-50">
                <h2 class="text-3xl font-bold text-gray-800 mb-2 text-center">All Comments & Notes</h2>
                <p class="text-gray-500 text-center mb-8">Detailed observations from reviewing each image</p>
                <div class="max-w-4xl mx-auto space-y-3">
                    ${comments.map(c => `
                        <div class="${c.comment.toLowerCase().includes('fun fact') ? 'fun-fact' : 'comment-box'}">
                            <div class="flex items-start gap-3">
                                <span class="inline-flex items-center bg-white px-3 py-1 rounded-full text-sm font-bold text-gray-700 shadow-sm">
                                    Image #${c.imageId}
                                </span>
                                <p class="text-gray-700 text-sm whitespace-pre-line">${c.comment}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;

        document.getElementById('app').innerHTML = html;
    }

    render();
    </script>
</body>
</html>
